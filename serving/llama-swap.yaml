# Ariadne local model serving. One OpenAI-compatible URL; the request's `model` picks the entry and llama-swap
# starts/stops llama-server to match (one model on the GPU at a time).
# Template: `python -m ariadne serve` fills {{SERVER}} and adds one entry per model in serving/models.yaml
# (agent, generate and embed kinds) into .ariadne/llama-swap.yaml. Loopback only.
healthCheckTimeout: 600
macros:
  # Every model start goes through llama_server_exclusive.py: unloads Ariadne's Ollama models first (one model on
  # the GPU at a time) and ties llama-server to a kill-on-close job so a swap never leaves it running.
  server: '{{SERVER}}'
  common: '--host 127.0.0.1 --port ${PORT} -np 1'
models: {}
