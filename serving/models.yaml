# Model catalog: every model a plan may pick, what it is for, and where its weights come from.
# Sized for one consumer GPU (8 GB) plus 32 GB of RAM: everything here runs; the big ones run partly on the CPU
# (llama-server --fit moves what does not fit in VRAM to RAM - slower, but it runs). Nothing here needs more.
#
# kind:  agent    - drives a Hermes run (tool calls, >= 64K context). A step's model.
#        generate - writes text when asked (generate_text tool); cannot drive Hermes itself.
#        image    - renders images (generate_image tool, stable-diffusion.cpp).
#        embed    - shared-memory embeddings.
# roles: the kinds of work the planner may suggest it for. defaults: the model suggested when a step names none.
# weights: Hugging Face files (repo + file, or repo + dir for split GGUFs), fetched into models/<name>/.
#          The LFS sha256 is pinned in .ariadne/model-pins.json on first fetch and verified on every fetch after;
#          a sha256 here is enforced from the start. ollama: an Ollama model whose GGUF blob is served read-only.
# args:  llama-server arguments for agent/generate models (default: flash attention, q8 KV cache, all on the GPU).
#        Agent models always get -c <context.window>.

# Every agent model is served with this window, and Hermes compresses the conversation when it passes
# compress_at: the run pauses, older turns become a summary (written by the same model, so no swap), the recent
# tail stays verbatim, and the run continues.
context:
  window: 98304
  compress_at: 70000

defaults:
  coding: qwen3.8-27b
  design: gemma-4-12b
  writing: gemma-4-26b-a4b
  quick: qwen3.5-9b
  image: z-image-turbo
  router: router
  embed: embed

models:
  # ---- Qwen family: one job each ----
  qwen3.8-27b:
    kind: agent
    roles: [coding, planning]
    about: Qwen3.8 27B (dense, newest). Best local coder and planner here; 17.7 GB, so most of it runs on the CPU - slow.
    size_gb: 17.7
    weights: {repo: unsloth/Qwen3.8-27B-GGUF, file: Qwen3.8-27B-UD-Q4_K_XL.gguf}
    args: "-fa on -ctk q8_0 -ctv q8_0 --jinja --fit on"

  qwen3.6-35b-a3b:
    kind: agent
    roles: [coding]
    about: Qwen3.6 35B-A3B (MoE, 3B active). Agentic coding; experts sit in RAM, so it is much faster than the 27B here.
    size_gb: 22.4
    weights: {repo: unsloth/Qwen3.6-35B-A3B-GGUF, file: Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf}
    args: "-fa on -ctk q8_0 -ctv q8_0 --jinja --fit on"

  qwen3.5-9b:
    kind: agent
    roles: [quick, coding, writing]
    about: Qwen3.5 9B. Fits entirely on the GPU with a 64K context; fast. Small edits, summaries, simple steps.
    size_gb: 5.6
    ollama: {tag: "qwen3.5:9b", blob: sha256-02d45dc1cf451ba2475ac33b301c2dd8f985abe4c182ce04a1f2f5bf0260278d}

  router:
    kind: generate
    roles: [router]
    about: Qwen3.5 4B. Picks the flow for a task (one short call).
    size_gb: 2.7
    ollama: {tag: "qwen3.5:4b", blob: sha256-a9d0a3e1d8c91732a3812becd31f8d4a8ff57414903f226306069f0437e2ac50}

  embed:
    kind: embed
    roles: [embed]
    about: Qwen3 Embedding 0.6B. Shared-memory search.
    size_gb: 0.6
    ollama: {tag: "qwen3-embedding:0.6b", blob: sha256-06507c7b42688469c4e7298b0a1e16deff06caf291cf0a5b278c308249c3e439}
    args: "-c 8192 --embedding --pooling last -ngl 99"

  # ---- Gemma family: design and writing ----
  gemma-4-12b:
    kind: agent
    roles: [design, writing]
    about: Gemma 4 12B. Design work - diagrams, architecture, UI layouts; 7.4 GB, mostly on the GPU.
    size_gb: 7.4
    weights: {repo: unsloth/gemma-4-12b-it-GGUF, file: gemma-4-12b-it-UD-Q4_K_XL.gguf}
    args: "-fa on -ctk q8_0 -ctv q8_0 --jinja --fit on"

  gemma-4-26b-a4b:
    kind: agent
    roles: [writing, design]
    about: Gemma 4 26B-A4B (MoE, 4B active). Writing - clear, well-structured prose; experts in RAM, reasonably fast.
    size_gb: 17.0
    weights: {repo: unsloth/gemma-4-26B-A4B-it-GGUF, file: gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf}
    args: "-fa on -ctk q8_0 -ctv q8_0 --jinja --fit on"

  gemma-4-31b:
    kind: agent
    roles: [writing]
    about: Gemma 4 31B (dense). Best local prose here, for long or important pieces; 18.8 GB, slow.
    size_gb: 18.8
    weights: {repo: unsloth/gemma-4-31B-it-GGUF, file: gemma-4-31B-it-UD-Q4_K_XL.gguf}
    args: "-fa on -ctk q8_0 -ctv q8_0 --jinja --fit on"

  # ---- images ----
  z-image-turbo:
    kind: image
    roles: [image]
    about: Z-Image-Turbo (6B, 8 steps). Good photoreal and text in images; uses a Qwen3 4B text encoder.
    size_gb: 6.9
    weights:
      diffusion: {repo: leejet/Z-Image-Turbo-GGUF, file: z_image_turbo-Q4_K.gguf}
      llm: {repo: unsloth/Qwen3-4B-Instruct-2507-GGUF, file: Qwen3-4B-Instruct-2507-Q4_K_M.gguf}
      vae: {repo: Comfy-Org/z_image_turbo, file: split_files/vae/ae.safetensors}
    sd_args: "--cfg-scale 1 --steps 8 --diffusion-fa --offload-to-cpu"

  sd-turbo:
    kind: image
    roles: [image]
    about: SD Turbo (1 step, 512px). Fast drafts, low quality. Stability AI Community License (non-commercial).
    size_gb: 5.2
    weights:
      model: {repo: stabilityai/sd-turbo, file: sd_turbo.safetensors,
              sha256: 3f067a1b943cf162f2b8f8588f6cf5824bd5b4c7d1d88d87164b9ca123616549}
    sd_args: "--steps 1 --cfg-scale 1.0 --sampling-method euler_a"
