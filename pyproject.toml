[project]
name = "ariadne-harness"
version = "0.1.2"
description = "A local-model agent harness: brief, backbrief, sign-off, execute, report."
requires-python = ">=3.12"
dependencies = ["mcp>=1.0", "fastapi>=0.110", "uvicorn>=0.29", "ddgs>=9", "ruamel.yaml>=0.18"]

[project.optional-dependencies]
parquet = ["pyarrow"]

[project.scripts]
ariadne = "ariadne.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["ariadne/tests"]          # Hermes's own suite is not ours
norecursedirs = ["vendor", ".venv", "models", ".ariadne", "overlay"]

[tool.hatch.build.targets.wheel]
packages = ["ariadne"]
