[project]
name = "ariadne-harness"
version = "0.1.0"
description = "A local-model agent harness built on Hermes Agent: brief, backbrief, sign-off, execute, report."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ariadne = "ariadne.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ariadne"]
