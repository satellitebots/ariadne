[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "rank_bm25",
    "numpy",
    "pyyaml",
    "openai",
    "requests",
]

[project.scripts]
rag = "rag.commands:main"

[tool.setuptools.packages.find]
include = ["rag*"]
