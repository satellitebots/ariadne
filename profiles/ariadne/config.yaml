# Ariadne profile: the Hermes home for the terminal (CLI) entry point (Slack: TODO). Local models from llama-swap, and
# the ariadne-tasks MCP server so any of those channels can give Ariadne a task (brief -> backbrief -> sign-off ->
# execute). Written into .hermes-home by `python -m ariadne profile`, which fills in this machine's paths.
model:
  default: "qwen3.5-9b"
  provider: "custom"
  base_url: "http://127.0.0.1:8090/v1"
  context_length: 65536
model_catalog:
  enabled: false
models_dev:
  url: "http://127.0.0.1:9/models-dev-disabled.json"
updates:
  check: false
telemetry:
  shared_metrics:
    enabled: false
    send: false
# agent.disabled_toolsets was here: it did not change the tool list (prompt-size proved it),
# so it was a false assurance. Enforcement is the gate plugin, and after the frontend pivot it is
# simply not given doing-tools. See docs/FRONTEND.md.
plugins:
  auto_update_check_hours: 0
  enabled: []
fallback_providers:
  - provider: custom
    model: ariadne-qwen3.5-4b
    base_url: http://localhost:11434/v1
mcp_servers:
  ariadne_tasks:
    command: python   # replaced with .venv's Python
    args: ["-m", "ariadne.tasks_mcp"]
    env: {}           # PYTHONPATH set to the repo
    timeout: 300
