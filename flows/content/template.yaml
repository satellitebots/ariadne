# The content flow as a task template. Steps are the backbone: outline from the sources, write each section as its
# own step (a fresh session per section, so no single call writes the whole piece), then assemble and check.
# Structure guides, never fences: every step has all of the flow's tools (search, fetch, terminal, ...); the only gate
# is a fact (the outline has sections); piece_check.py is a tool the worker runs to find gaps, not a gate; one model
# review at the end that only reports (a failing review goes to the person, it is never retried).
# {checks} is filled in by Ariadne: the folder of shared gate scripts.
params:
  piece: "What should be made, for whom, and where will it be read?"
  output: "The file to make (e.g. index.html, POST.md, GUIDE.md)"
  sources: "Where the facts come from (links, files in the workspace, or 'search the web')"
goal: "{output}: {piece}"
steps:
  - title: Outline from the sources
    instruction: |
      Read the sources first ({sources}); search and fetch more wherever they leave a gap. Record every source
      you will use in SOURCES.md, one line each, exactly "- <url> | <publisher (the site it is on)> | <what it
      supports> | <YYYY-MM-DD: the page's date, or today if it has none>"; a file from the workspace is
      "- <path> | <who made it> | <what it supports>". Then write OUTLINE.md: '## Audience' (who reads it, what they need); '## Conventions'
      (terms, notation and sign conventions as the sources use them, so every section says things the same way);
      and '## Steps': one line per section of the piece, in reading order (as many as it needs), each "Section
      title: what it must cover (sources: ...)". Where the sources are silent, find a source or mark it
      "(not in sources)" rather than guess.
    outputs: [SOURCES.md, OUTLINE.md]
    gate: {type: run, text: "python {checks}/plan_steps.py OUTLINE.md"}
  - title: Write
    each: OUTLINE.md
    instruction: |
      Write section {i} of {count} of {output}: {item}
      Use OUTLINE.md (its audience and conventions) and SOURCES.md, and search or fetch more when the section
      needs it (add what you use to SOURCES.md). Back claims with sources; say so where they are silent. Give the
      section a heading with its title and add it after the sections already in {output} (create the file with
      its frame if this is section 1). Fix an earlier section only if this one shows it is wrong, and say so.
    outputs: ["{output}"]
  - title: Assemble and check
    instruction: |
      Read {output} whole. Fix order, duplicate or contradictory statements (follow '## Conventions' in
      OUTLINE.md), headings and broken markup; add a short sources section from SOURCES.md. If it is HTML: one
      self-contained file, a viewport meta tag, and wide tables or code scroll sideways (overflow-x: auto) instead
      of widening the page. To find gaps, run: python {checks}/piece_check.py OUTLINE.md {output}
      (it lists missing sections, thin ones and HTML problems; use your judgment on each).
    outputs: ["{output}"]
gates:
  - {type: review, text: "Every factual statement in {output} is supported by a source in SOURCES.md, and nothing contradicts the conventions in OUTLINE.md"}
trigger: {kind: manual}
retries: 1
