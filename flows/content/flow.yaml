name: content
description: Make content for a channel - written pieces (documents, posts, newsletters, blog, copy) and images, saved in the workspace.
when: documents, reports, articles, social posts, newsletters, blog posts, marketing copy, scripts, repurposing long content into short pieces, images that go with any of these
status: experimental       # shipped, not yet validated end to end
model: gemma-4-12b     # the agent model when a step names none
skills: [channel-content, draft-and-edit]
requires: [node, chrome]   # for the browser server; checked before a task runs
mcp_servers: [memory, browser, export, image, web, jobs]
toolsets:
  plan: [file, skills, search]
  execute: [file, skills, todo, search]
plan_tools: [read_file, search_files, skill_view, skills_list, memory_recall, web_search, web_fetch, navigate_page, new_page, list_pages, select_page, take_snapshot, take_screenshot, wait_for]
max_turns: {plan: 15, execute: 30}
run_budget: {plan: 900, execute: 1800}
task_budget: 5400         # the whole task's wall clock, worker time only; out of it keeps the work and lets the gates decide
browser:
  real_logins: false       # a clean, isolated Chrome; `python -m ariadne browser debug on` attaches to your Chrome when a step needs a login
network:
  blocklist: []            # hosts this flow must not reach, e.g. [example.com]; everything else is allowed
