# MCP servers that flows can name in mcp_servers. Hermes mcp_servers format; {python} and {root} are filled in
# when a flow is compiled. Add your own here (any stdio or HTTP MCP server), then list it in a flow.
memory:   # the durable shared memory (ariadne/memory_mcp.py)
  command: "{python}"
  args: ["-m", "ariadne.memory_mcp"]
  env: {PYTHONPATH: "{root}"}
  timeout: 60
jobs:     # hand heavy work to Ariadne: it unloads the model, runs the job, wakes the model with the result
  command: "{python}"
  args: ["-m", "ariadne.jobs_mcp"]
  env: {PYTHONPATH: "{root}", ARIADNE_FLOW_HOME: "{home}"}
  timeout: 60
web:      # web_fetch: read official docs as text (search itself is Hermes' web_search, keyless ddgs backend)
  command: "{python}"
  args: ["-m", "ariadne.web_mcp"]
  env: {PYTHONPATH: "{root}"}
  timeout: 60
git:      # local git: status, diff, log, show, add, commit (ariadne/git_mcp.py)
  command: "{python}"
  args: ["-m", "ariadne.git_mcp"]
  env: {PYTHONPATH: "{root}"}
  timeout: 120
browser:  # Chrome, visible, through Chrome DevTools MCP (pinned). real_logins: attaches to your running Chrome
          # (one-time: chrome://inspect/#remote-debugging -> allow; Chrome asks before each connection).
          # isolated: a fresh temporary profile with no logins.
  command: "{npx}"
  args: ["-y", "chrome-devtools-mcp@1.13.0", "--no-usage-statistics", "--no-performance-crux"]
  args_when:
    real_logins: ["--autoConnect"]
    isolated: ["--isolated"]
  env: {CHROME_DEVTOOLS_MCP_NO_UPDATE_CHECKS: "1"}
  timeout: 180
  connect_timeout: 120
vscode:   # VS Code MCP server extension (JuehangQin.vscode-mcp-server) in your running VS Code: the editor's files,
          # edits, diagnostics and symbols for the open workspace. Turn it on from its VS Code status bar item.
  url: "http://127.0.0.1:3000/mcp"
  timeout: 120
  connect_timeout: 10
export:   # Pandoc document export (ariadne/export_mcp.py; Pandoc pinned in serving/bin.lock)
  command: "{python}"
  args: ["-m", "ariadne.export_mcp"]
  env: {PYTHONPATH: "{root}"}
  timeout: 300
image:    # images with a catalog image model (Z-Image-Turbo, SD Turbo) via stable-diffusion.cpp (ariadne/image_mcp.py)
  command: "{python}"
  args: ["-m", "ariadne.image_mcp"]
  env: {PYTHONPATH: "{root}"}
  timeout: 600
diagram:  # Mermaid: check syntax, render SVG/PNG/PDF with the pinned Mermaid CLI on your Chrome (ariadne/diagram_mcp.py)
  command: "{python}"
  args: ["-m", "ariadne.diagram_mcp"]
  env: {PYTHONPATH: "{root}"}
  timeout: 240
text:     # drafts by a generate-kind catalog model, e.g. Fimbulvetr for prose (ariadne/text_mcp.py)
  command: "{python}"
  args: ["-m", "ariadne.text_mcp"]
  env: {PYTHONPATH: "{root}"}
  timeout: 900
