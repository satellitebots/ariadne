# The coding flow as a task template (docs/DESIGN.md, "Flows as templates"). Steps are the backbone: plan the change
# as a short list, make each item as its own step (a fresh session, one small change), then prove it with commands.
# Structure guides, never fences: every step has all of the flow's tools, and the only gates are facts (a plan
# with steps, the worker's own PASS on the plan's commands).
# {checks} is filled in by Ariadne: the folder of shared gate scripts.
params:
  change: "What should change, in one or two sentences?"
  done_when: "How do we know it works (a test to pass, a command to run, what you should see)?"
goal: "{change}"
steps:
  - title: Plan the change
    instruction: |
      Understand the code this touches: read it, search it, run it and its tests as much as you need. Then write
      PLAN.md: '## Goal' ({change}); '## Done when' ({done_when}) as commands to run and what they must show; and
      '## Steps': a numbered list of the changes in order, one line each, naming the file(s) it touches (as many
      as the work needs; small steps go better). Tests first when the change can be tested. The changes
      themselves are the next steps, so leave the code as it was unless something must change to plan well.
    outputs: [PLAN.md]
    gate: {type: run, text: "python {checks}/plan_steps.py PLAN.md"}
  - title: Change
    each: PLAN.md
    instruction: |
      Make change {i} of {count} from PLAN.md: {item}
      Earlier changes are done; later ones are planned as their own steps. Do whatever this change needs, including
      a fix elsewhere it depends on (say so in your report). Run the tests that cover it and fix what they show.
  - title: Prove it
    instruction: |
      Run every command under '## Done when' in PLAN.md, and the repository's tests. Fix what fails (if the plan
      was wrong, fix it and say so). Write CHECK.md: each command, what it printed (trimmed), and pass or fail,
      ending with the line 'RESULT: PASS' or 'RESULT: FAIL: <why>'. Then commit the change with a message that says
      what changed and why.
    outputs: [CHECK.md]
    gate: {type: run, text: "python {checks}/verify_result.py CHECK.md"}
gates: []
trigger: {kind: manual}
retries: 1
