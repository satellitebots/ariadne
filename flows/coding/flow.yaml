name: coding
description: Change code in a repository, prove it with its tests, and commit locally.
when: fixing bugs, adding features, refactoring, writing or fixing tests - any change to code in a repository
model: qwen3.6-35b-a3b           # plans and runs steps (MoE, 3B active: ~10x faster than the dense 27B here)
reasoning: {execute: low}       # think less while executing an approved plan
skills: [fix-and-verify, coding-standards]
requires: [node, chrome]   # for the browser server; checked before a task runs
mcp_servers: [memory, git, jobs, web, browser, data, ci, rag] # optional: vscode (VS Code MCP extension running)
toolsets:
  plan: [file, skills, search]
  execute: [file, terminal, skills, todo, search]
plan_tools: [read_file, search_files, skill_view, skills_list, memory_recall, git_status, git_diff, git_log, git_show,
             web_search, web_fetch,
             list_files_code, read_file_code, get_diagnostics_code, search_symbols_code, get_document_symbols_code,
             get_symbol_definition_code, navigate_page, new_page, list_pages, select_page, take_snapshot, take_screenshot, wait_for]
checks:
  - {run: "\"{python}\" -m pytest -q", when_exists: "tests"}
browser:
  real_logins: false       # a clean, isolated Chrome; `python -m ariadne browser debug on` attaches to your Chrome when a step needs a login
max_turns: {plan: 20, execute: 80}    # a 9-step build used all 40 in 40 min (RAG v1); running out goes to QA
run_budget: {plan: 2700, execute: 3600}   # seconds; the 27B plans at ~2 tok/s
task_budget: 14400        # the whole task's wall clock, worker time only; out of it keeps the work and lets the gates decide
