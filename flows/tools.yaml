# Tools and MCP servers: a closed set, like flows and models.
#
# A flow may only use servers and system tools listed here. The planner is told this set, and anything it needs
# that is missing becomes an explicit "TO INSTALL AFTER SIGN-OFF" line in the backbrief - the person approves the
# download by approving the plan, and only then does Ariadne install it.
approved:
  mcp:
    - memory
    - jobs
    - web
    - git
    - browser
    - vscode
    - export
    - image
    - diagram
    - text
    # Approved names whose servers are declared in mcp_servers.yaml as they are built. A flow may only list a
    # server that exists there, so these cost nothing until a flow asks for them.
    - ci        # Jenkins, GitHub Actions, GitLab CI: trigger, read status, fetch logs
    - data      # csv / parquet / sqlite: profile, query, transform
    - office    # docx and xlsx read/write (wordcraft, numbercraft)
    - rag       # ingest, chunk, embed, vector store, retrieval eval
  system:
    - git
    - uv
    - ollama
    - node
    - chrome
    - pandoc
    # Coding p80: containers, clusters, CI, and the small utilities every repo script assumes.
    - docker
    - kubectl
    - helm
    - gh
    - jq
    - curl
    - rg
    - sqlite3
    - ffmpeg

# How a missing system tool is installed, so the backbrief can name the exact command instead of "install it".
install:
  node: "winget install OpenJS.NodeJS.LTS (or: python -m ariadne install --system)"
  chrome: "install Chrome, or: python -m ariadne install --system"
  pandoc: "python -m ariadne install --system (fetches the pinned Pandoc)"
  git: "winget install Git.Git (or: python -m ariadne install --system)"
  uv: "python -m ariadne install --system"
  ollama: "winget install Ollama.Ollama (or: python -m ariadne install --system)"
  docker: "winget install Docker.DockerDesktop (needs a restart; or point DOCKER_HOST at a machine on the LAN)"
  kubectl: "winget install Kubernetes.kubectl"
  helm: "winget install Helm.Helm"
  gh: "winget install GitHub.cli (then: gh auth login)"
  jq: "winget install jqlang.jq"
  rg: "winget install BurntSushi.ripgrep.MSVC"
  sqlite3: "winget install SQLite.SQLite"
  ffmpeg: "winget install Gyan.FFmpeg"
  curl: "built into Windows 10+ / macOS / most Linux; if missing: python -m ariadne install --system"
